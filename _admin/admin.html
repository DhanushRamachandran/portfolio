<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/site/assets/styles.css">
<style>
  body { background-image: none; }
  .shell { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 58px); }
  .side { border-right: 1px solid var(--line); padding: 20px 12px; display: grid; align-content: start; gap: 2px; background: var(--surface); }
  .side button { text-align: left; font: 500 .9rem var(--f-mono); color: var(--muted); background: none; border: 0; padding: 8px 12px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; }
  .side button:hover { background: var(--sunken); color: var(--fg); }
  .side button[aria-current="true"] { background: var(--accent-soft); color: var(--fg); }
  .side .n { opacity: .6; }
  .side hr { border: 0; border-top: 1px solid var(--line); margin: 10px 4px; }
  .work { padding: 28px 32px 80px; min-width: 0; }
  .work h2 { font-size: var(--step-2); margin-bottom: 4px; }
  .hint { color: var(--muted); font-size: .92rem; max-width: 70ch; margin-bottom: 20px; }
  .split { display: grid; grid-template-columns: 280px 1fr; gap: 20px; align-items: start; }
  .split > * { min-width: 0; }
  .list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; position: sticky; top: 78px; }
  .list-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .list ol { list-style: none; margin: 0; padding: 4px; max-height: 65vh; overflow-y: auto; }
  .list li { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
  .list li:hover { background: var(--sunken); }
  .list li[aria-selected="true"] { background: var(--accent-soft); }
  .list li .t { display: block; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list li .s { font: 500 .7rem var(--f-mono); color: var(--muted); display: block; }
  .mv { display: flex; gap: 2px; }
  .mv button { background: none; border: 1px solid transparent; color: var(--muted); border-radius: 4px; width: 24px; height: 24px; cursor: pointer; font: 500 .8rem var(--f-mono); }
  .mv button:hover { border-color: var(--line); color: var(--fg); background: var(--surface); }
  .form { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; display: grid; gap: 18px; }
  .form-top { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
  .field { display: grid; gap: 6px; }
  .field > label, .field > .lab { font: 500 .78rem var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .field small { color: var(--muted); font-size: .8rem; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .grid2 > *, .grid3 > * { min-width: 0; }
  .grid2, .grid3 { align-items: start; }
  input[type=text], input[type=url], input[type=email], textarea, select {
    width: 100%; font: 400 .95rem var(--f-body); color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 7px; padding: 9px 11px;
  }
  textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
  textarea.code { font-family: var(--f-mono); font-size: .86rem; min-height: 360px; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .check { display: flex; gap: 8px; align-items: center; font-size: .95rem; }
  .refs { display: flex; flex-wrap: wrap; gap: 6px; }
  .refs label { display: inline-flex; gap: 6px; align-items: center; font-size: .85rem; border: 1px solid var(--line); padding: 5px 9px; border-radius: 6px; cursor: pointer; }
  .refs input:checked + span { color: var(--accent); font-weight: 600; }
  .danger { color: #c0392b; border-color: color-mix(in srgb, #c0392b 40%, var(--line)); }
  .danger:hover { border-color: #c0392b; }
  .btn.sm { padding: 6px 10px; font-size: .82rem; }
  .savebar { display: flex; gap: 10px; align-items: center; }
  .dirty { font: 500 .78rem var(--f-mono); color: var(--warn); }
  .clean { font: 500 .78rem var(--f-mono); color: var(--ok); }
  .log { background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 14px; font: 400 .8rem/1.6 var(--f-mono); white-space: pre-wrap; overflow-x: auto; max-height: 340px; overflow-y: auto; }
  .steps { display: grid; gap: 10px; padding-left: 20px; margin: 0; max-width: 70ch; }
  .box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; display: grid; gap: 16px; max-width: 820px; }
  .changes { font: 400 .82rem var(--f-mono); color: var(--muted); }
  .err { border-left: 3px solid #c0392b; background: color-mix(in srgb, #c0392b 10%, var(--surface)); padding: 10px 14px; border-radius: 0 6px 6px 0; white-space: pre-wrap; font-size: .9rem; }
  .thumb { max-width: 220px; border-radius: 6px; border: 1px solid var(--line); }
  @media (max-width: 900px) { .shell { grid-template-columns: 1fr; } .side { grid-auto-flow: column; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); } .split { grid-template-columns: 1fr; } .list { position: static; } .grid2, .grid3 { grid-template-columns: 1fr; } .work { padding: 20px 16px 60px; } }
</style>
</head>
<body>
<header class="bar">
  <div class="wrap" style="max-width:none">
    <span class="path">~/<b>dhanush</b>/<span class="cur">admin</span></span>
    <div class="savebar" style="margin-left:auto">
      <span id="state" class="clean">saved</span>
      <button class="btn sm" id="preview-btn" type="button">Preview site ↗</button>
      <button class="btn sm primary" id="save-btn" type="button">Save <kbd style="margin-left:4px">Ctrl S</kbd></button>
    </div>
  </div>
</header>
<div class="shell">
  <nav class="side" id="side" aria-label="Sections"></nav>
  <main class="work" id="work"><p class="muted">Loading content…</p></main>
</div>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const slug = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60);
  const api = async (path, opts = {}) => {
    const r = await fetch(path, { ...opts, headers: { "X-Admin": "1", ...(opts.headers || {}) } });
    const j = await r.json().catch(() => ({ error: "Unexpected response from the admin server." }));
    if (!r.ok || j.error) throw new Error(j.error || r.statusText);
    return j;
  };
  function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 2200); }

  let S = null, dirty = false, section = "projects", selected = {};
  function setDirty(v) { dirty = v; const s = $("#state"); s.className = v ? "dirty" : "clean"; s.textContent = v ? "● unsaved changes" : "saved"; }
  addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  /* ---------- markdown <-> blocks for writeups ---------- */
  function blocksToMd(blocks) {
    return (blocks || []).map((b) => {
      if (b.h) return "## " + b.h;
      if (b.code != null) return "```" + (b.lang || "") + "\n" + b.code + "\n```";
      if (b.list) return b.list.map((x) => "- " + x).join("\n");
      return b.p || "";
    }).join("\n\n");
  }
  function mdToBlocks(md) {
    const lines = md.replace(/\r/g, "").split("\n"), out = [];
    let para = [], list = null;
    const flush = () => { if (para.length) out.push({ p: para.join(" ").trim() }); para = []; if (list) out.push({ list }); list = null; };
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i];
      const fence = l.match(/^```\s*([\w-]*)\s*$/);
      if (fence) {
        flush(); const code = [];
        for (i++; i < lines.length && !/^```\s*$/.test(lines[i]); i++) code.push(lines[i]);
        out.push({ code: code.join("\n"), lang: fence[1] || "" }); continue;
      }
      const h = l.match(/^#{1,3}\s+(.*)/);
      if (h) { flush(); out.push({ h: h[1].trim() }); continue; }
      const li = l.match(/^\s*[-*]\s+(.*)/);
      if (li) { if (para.length) { out.push({ p: para.join(" ").trim() }); para = []; } (list = list || []).push(li[1].trim()); continue; }
      if (!l.trim()) { flush(); continue; }
      if (list) { out.push({ list }); list = null; }
      para.push(l.trim());
    }
    flush();
    return out;
  }

  /* ---------- schemas ---------- */
  const F = (key, label, type = "text", extra = {}) => ({ key, label, type, ...extra });
  const COLL = {
    projects: {
      title: "Projects", path: () => S.projects, label: (p) => p.title || "(untitled)", sub: (p) => `${p.kind} · ${p.year}${p.featured ? " · ★ featured" : ""}`,
      hint: "Everything on the Projects page. Tick “Featured” to show a project on the profile (home) page. Order here is the order on the site.",
      blank: () => ({ id: "", title: "New project", year: String(new Date().getFullYear()), kind: "personal", org: "", featured: false, tags: [], summary: "", problem: "", build: [], impact: [], stack: [], repo: "", demo: "", image: "" }),
      rows: [
        [F("title", "Title"), F("id", "URL id", "slug", { help: "Used in projects.html#id. Filled from the title if left empty." })],
        [F("kind", "Type", "select", { options: ["work", "academic", "personal"] }), F("year", "Year"), F("org", "Organisation")],
        [F("featured", "Show on the profile page", "check")],
        [F("summary", "One-line summary", "textarea", { rows: 2 })],
        [F("problem", "Problem", "textarea", { rows: 3 })],
        [F("build", "What you built", "lines", { help: "One point per line." })],
        [F("impact", "Outcomes", "lines", { help: "One per line. The first appears on the project card." })],
        [F("tags", "Filter tags", "tags", { help: "Comma-separated, e.g. Agents, RAG, ML" }), F("stack", "Stack", "tags")],
        [F("repo", "Code URL", "url"), F("demo", "Demo URL", "url")],
        [F("image", "Cover image (optional)", "image")]
      ]
    },
    writeups: {
      title: "Writeups", path: () => S.writeups, label: (w) => w.title || "(untitled)", sub: (w) => `${w.date} · ${w.status}`,
      hint: "Write in simple markdown: ## heading, - bullet, ```code```, blank line between paragraphs. Paragraphs starting with TODO: are highlighted on the site.",
      blank: () => ({ id: "", title: "New writeup", date: new Date().toISOString().slice(0, 7), read: "5 min", status: "draft", tags: [], dek: "", body: [{ p: "Start writing here." }] }),
      rows: [
        [F("title", "Title"), F("id", "URL id", "slug")],
        [F("date", "Date (YYYY-MM)"), F("read", "Read time"), F("status", "Status", "select", { options: ["draft", "published"] })],
        [F("tags", "Tags", "tags")],
        [F("dek", "Subtitle", "textarea", { rows: 2 })],
        [F("body", "Body (markdown)", "markdown")]
      ]
    },
    research: {
      title: "Research", path: () => S.research, label: (r) => r.area || "(untitled)", sub: (r) => `${r.evidence.length} linked projects`,
      hint: "Research-interest cards. Link each one to the projects that motivated it.",
      blank: () => ({ area: "New research area", keywords: [], body: "", questions: [], evidence: [] }),
      rows: [
        [F("area", "Area")],
        [F("keywords", "Keywords", "tags")],
        [F("body", "Description", "textarea", { rows: 4 })],
        [F("questions", "Open questions", "lines", { help: "One per line." })],
        [F("evidence", "Related projects", "refs")]
      ]
    },
    experience: {
      title: "Experience", path: () => S.experience, label: (x) => x.role || "(untitled)", sub: (x) => `${x.org} · ${x.dates}`,
      hint: "Shown on the profile timeline (first two points) and in full on the resume page. Newest first.",
      blank: () => ({ org: "", sector: "", role: "New role", dates: "", place: "", stack: [], bullets: [] }),
      rows: [
        [F("role", "Role"), F("org", "Organisation")],
        [F("sector", "Sector"), F("dates", "Dates", "text", { help: "e.g. 06/2026 – 08/2026" }), F("place", "Location")],
        [F("bullets", "Points", "lines", { help: "One per line. Put the strongest two first." })],
        [F("stack", "Stack", "tags")]
      ]
    },
    metrics: {
      title: "Highlights", path: () => S.metrics, label: (m) => `${m.value} ${m.label}`, sub: (m) => m.ctx,
      hint: "The big numbers under the profile hero. Four fit best.",
      blank: () => ({ value: "0×", label: "", ctx: "" }),
      rows: [[F("value", "Number"), F("label", "What it measures")], [F("ctx", "Context (small print)")]]
    },
    education: {
      title: "Education", path: () => S.education, label: (e) => e.degree, sub: (e) => e.school,
      hint: "", blank: () => ({ school: "", degree: "New degree", grade: "", dates: "", place: "", notes: "" }),
      rows: [[F("degree", "Degree"), F("school", "School")], [F("grade", "Grade"), F("dates", "Dates"), F("place", "Location")], [F("notes", "Courses / notes", "textarea", { rows: 2 })]]
    }
  };

  /* ---------- sidebar ---------- */
  const SECTIONS = [
    ["profile", "Profile"], ["metrics", "Highlights"], ["experience", "Experience"], ["projects", "Projects"],
    ["research", "Research"], ["writeups", "Writeups"], ["skills", "Skills & certs"], ["education", "Education"],
    ["-"], ["files", "Resume & images"], ["publish", "Publish"]
  ];
  function paintSide() {
    $("#side").innerHTML = SECTIONS.map(([id, label]) => id === "-" ? "<hr>" :
      `<button type="button" data-sec="${id}" aria-current="${id === section}">${label}${COLL[id] ? `<span class="n">${COLL[id].path().length}</span>` : ""}</button>`).join("");
  }
  $("#side").addEventListener("click", (e) => { const b = e.target.closest("[data-sec]"); if (!b) return; section = b.dataset.sec; try { localStorage.setItem("admin-sec", section); } catch (_) {} render(); });

  /* ---------- field rendering ---------- */
  function fieldHtml(f, obj, idp) {
    const v = obj[f.key], id = `${idp}-${f.key}`;
    const help = f.help ? `<small>${esc(f.help)}</small>` : "";
    let input;
    switch (f.type) {
      case "textarea": input = `<textarea id="${id}" data-k="${f.key}" rows="${f.rows || 3}">${esc(v)}</textarea>`; break;
      case "lines": input = `<textarea id="${id}" data-k="${f.key}" data-t="lines" rows="${Math.max(3, (v || []).length + 1)}">${esc((v || []).join("\n"))}</textarea>`; break;
      case "tags": input = `<input type="text" id="${id}" data-k="${f.key}" data-t="tags" value="${esc((v || []).join(", "))}">`; break;
      case "select": input = `<select id="${id}" data-k="${f.key}">${f.options.map((o) => `<option${o === v ? " selected" : ""}>${o}</option>`).join("")}</select>`; break;
      case "check": return `<label class="check"><input type="checkbox" id="${id}" data-k="${f.key}" data-t="check"${v ? " checked" : ""}> ${esc(f.label)}</label>`;
      case "markdown": input = `<textarea class="code" id="${id}" data-k="${f.key}" data-t="markdown">${esc(blocksToMd(v))}</textarea>`; break;
      case "refs": input = `<div class="refs">${S.projects.map((p) => `<label><input type="checkbox" data-k="${f.key}" data-t="ref" value="${esc(p.id)}"${(v || []).includes(p.id) ? " checked" : ""}><span>${esc(p.title)}</span></label>`).join("")}</div>`; break;
      case "image": input = `<div class="row"><input type="text" id="${id}" data-k="${f.key}" value="${esc(v)}" placeholder="assets/img/…" style="flex:1;min-width:200px">
          <label class="btn sm" style="cursor:pointer">Upload…<input type="file" accept="image/*" data-upload="${id}" hidden></label></div>
          ${v ? `<img class="thumb" src="/site/${esc(v)}" alt="">` : ""}`; break;
      case "slug": input = `<input type="text" id="${id}" data-k="${f.key}" data-t="slug" value="${esc(v)}" placeholder="auto from title">`; break;
      default: input = `<input type="${f.type === "url" ? "url" : "text"}" id="${id}" data-k="${f.key}" value="${esc(v)}">`;
    }
    return `<div class="field"><label for="${id}">${esc(f.label)}</label>${input}${help}</div>`;
  }
  function rowsHtml(rows, obj, idp) {
    return rows.map((r) => r.length === 1 ? fieldHtml(r[0], obj, idp) : `<div class="grid${r.length}">${r.map((f) => fieldHtml(f, obj, idp)).join("")}</div>`).join("");
  }
  function bindForm(root, obj, onChange) {
    root.addEventListener("input", (e) => {
      const el = e.target, k = el.dataset.k; if (!k) return;
      const t = el.dataset.t;
      if (t === "lines") obj[k] = el.value.split("\n").map((s) => s.trim()).filter(Boolean);
      else if (t === "tags") obj[k] = el.value.split(",").map((s) => s.trim()).filter(Boolean);
      else if (t === "check") obj[k] = el.checked;
      else if (t === "markdown") obj[k] = mdToBlocks(el.value);
      else if (t === "ref") obj[k] = [...root.querySelectorAll(`[data-k="${k}"]:checked`)].map((x) => x.value);
      else if (t === "slug") obj[k] = slug(el.value);
      else obj[k] = el.value;
      setDirty(true); onChange && onChange(k);
    });
    root.addEventListener("change", async (e) => {
      const up = e.target.dataset.upload; if (!up || !e.target.files[0]) return;
      const file = e.target.files[0];
      try {
        const r = await api("/api/image", { method: "POST", body: file, headers: { "X-Filename": encodeURIComponent(file.name) } });
        const inp = $("#" + up); inp.value = r.path; inp.dispatchEvent(new Event("input", { bubbles: true }));
        toast("Uploaded " + r.path); render();
      } catch (err) { toast(err.message); }
    });
  }

  /* ---------- collection editor ---------- */
  function renderColl(key) {
    const C = COLL[key], arr = C.path();
    let i = Math.min(selected[key] ?? 0, arr.length - 1);
    const item = arr[i];
    $("#work").innerHTML = `<h2>${C.title}</h2><p class="hint">${esc(C.hint)}</p>
      <div class="split">
        <div class="list"><div class="list-head"><span class="eyebrow">${arr.length} items</span><button class="btn sm" id="add" type="button">+ New</button></div>
          <ol>${arr.map((x, j) => `<li data-i="${j}" aria-selected="${j === i}"><div style="min-width:0"><span class="t">${esc(C.label(x))}</span><span class="s">${esc(C.sub(x))}</span></div>
            <span class="mv"><button type="button" data-mv="-1" data-i="${j}" aria-label="Move up">↑</button><button type="button" data-mv="1" data-i="${j}" aria-label="Move down">↓</button></span></li>`).join("")}</ol></div>
        ${item ? `<div class="form" id="form">
          <div class="form-top"><span class="eyebrow">editing ${i + 1} of ${arr.length}</span>
            <div class="row">${key === "projects" && item.id ? `<a class="btn sm" href="/site/projects.html#${esc(item.id)}" target="_blank">View on site ↗</a>` : ""}${key === "writeups" && item.id ? `<a class="btn sm" href="/site/writeups.html#${esc(item.id)}" target="_blank">View on site ↗</a>` : ""}
            <button class="btn sm" type="button" id="dup">Duplicate</button><button class="btn sm danger" type="button" id="del">Delete</button></div></div>
          <div id="del-confirm" hidden class="err">Delete “${esc(C.label(item))}”? <button class="btn sm danger" type="button" id="del-yes">Yes, delete</button> <button class="btn sm" type="button" id="del-no">Cancel</button></div>
          ${rowsHtml(C.rows, item, key + i)}
        </div>` : `<div class="empty">Nothing here yet. Click “+ New”.</div>`}
      </div>`;
    const list = $(".list ol");
    list.addEventListener("click", (e) => {
      const mv = e.target.closest("[data-mv]");
      if (mv) {
        const a = +mv.dataset.i, b = a + +mv.dataset.mv; if (b < 0 || b >= arr.length) return;
        [arr[a], arr[b]] = [arr[b], arr[a]]; if (selected[key] === a) selected[key] = b; setDirty(true); render(); return;
      }
      const li = e.target.closest("li"); if (li) { selected[key] = +li.dataset.i; render(); }
    });
    $("#add").onclick = () => { arr.unshift(C.blank()); selected[key] = 0; setDirty(true); render(); const t = $("#form input"); t && t.select(); };
    if (!item) return;
    const form = $("#form");
    bindForm(form, item, (k) => {
      if ((k === "title") && "id" in item) {
        const idInput = form.querySelector('[data-t="slug"]');
        if (!idInput.dataset.touched) { item.id = uniqueId(arr, slug(item.title), item); idInput.value = item.id; }
      }
      if (k === "id") form.querySelector('[data-t="slug"]').dataset.touched = "1";
      const li = list.querySelector(`li[data-i="${i}"]`);
      if (li) { li.querySelector(".t").textContent = C.label(item); li.querySelector(".s").textContent = C.sub(item); }
    });
    const idInput = form.querySelector('[data-t="slug"]'); if (idInput && item.id) idInput.dataset.touched = "1";
    $("#dup").onclick = () => { const c = JSON.parse(JSON.stringify(item)); if ("id" in c) c.id = uniqueId(arr, c.id + "-copy"); if (c.title) c.title += " (copy)"; arr.splice(i + 1, 0, c); selected[key] = i + 1; setDirty(true); render(); };
    $("#del").onclick = () => { $("#del-confirm").hidden = false; };
    $("#del-no").onclick = () => { $("#del-confirm").hidden = true; };
    $("#del-yes").onclick = () => {
      arr.splice(i, 1);
      if (key === "projects") S.research.forEach((r) => (r.evidence = r.evidence.filter((id) => id !== item.id)));
      selected[key] = Math.max(0, i - 1); setDirty(true); render();
    };
  }
  function uniqueId(arr, base, self) {
    base = base || "item"; let id = base, n = 2;
    while (arr.some((x) => x !== self && x.id === id)) id = `${base}-${n++}`;
    return id;
  }

  /* ---------- profile ---------- */
  function renderProfile() {
    const P = S.person;
    const view = { ...P, github: P.links.github, linkedin: P.links.linkedin, about: P.about.join("\n\n") };
    $("#work").innerHTML = `<h2>Profile</h2><p class="hint">Your name, headline and the About section on the home page.</p>
      <div class="form" id="form" style="max-width:860px">
        ${rowsHtml([[F("name", "Name"), F("handle", "Handle (shown as ~/handle)")], [F("role", "Headline role"), F("location", "Location")],
          [F("status", "Status line (next to the green dot)")], [F("tagline", "Tagline", "textarea", { rows: 3 })],
          [F("email", "Email"), F("github", "GitHub URL", "url"), F("linkedin", "LinkedIn URL", "url")],
          [F("about", "About", "textarea", { rows: 10, help: "Leave a blank line between paragraphs." })]], view, "p")}
      </div>`;
    bindForm($("#form"), view, (k) => {
      if (k === "github" || k === "linkedin") P.links[k] = view[k];
      else if (k === "about") P.about = view.about.split(/\n\s*\n/).map((s) => s.replace(/\s*\n\s*/g, " ").trim()).filter(Boolean);
      else P[k] = view[k];
    });
  }

  /* ---------- skills ---------- */
  function renderSkills() {
    const text = Object.entries(S.skills).map(([k, v]) => `${k}: ${v.join(", ")}`).join("\n");
    $("#work").innerHTML = `<h2>Skills & certifications</h2><p class="hint">One group per line, written as <code>Group: skill, skill, skill</code>.</p>
      <div class="form" style="max-width:860px">
        <div class="field"><label for="skills">Skill groups</label><textarea id="skills" class="code" style="min-height:220px">${esc(text)}</textarea></div>
        <div class="field"><label for="certs">Certifications</label><textarea id="certs" rows="3">${esc(S.certificates.join("\n"))}</textarea><small>One per line.</small></div>
      </div>`;
    $("#skills").oninput = (e) => {
      const o = {};
      e.target.value.split("\n").forEach((l) => { const m = l.match(/^([^:]+):(.*)$/); if (m) o[m[1].trim()] = m[2].split(",").map((s) => s.trim()).filter(Boolean); });
      S.skills = o; setDirty(true);
    };
    $("#certs").oninput = (e) => { S.certificates = e.target.value.split("\n").map((s) => s.trim()).filter(Boolean); setDirty(true); };
  }

  /* ---------- files ---------- */
  async function renderFiles() {
    const [res, imgs] = await Promise.all([api("/api/resume"), api("/api/images")]);
    $("#work").innerHTML = `<h2>Resume & images</h2><p class="hint">Files are written straight into the website folder. Publish afterwards to put them online.</p>
      <div class="box" style="margin-bottom:20px">
        <h3>Resume PDF</h3>
        <p class="muted">${res.exists ? `Current file: assets/resume.pdf · ${(res.size / 1024).toFixed(0)} KB · updated ${esc(res.modified)}` : "No resume uploaded yet."}</p>
        <div class="row"><label class="btn primary" style="cursor:pointer">Replace resume PDF…<input type="file" id="resume-in" accept="application/pdf" hidden></label>
        ${res.exists ? `<a class="btn" href="/site/assets/resume.pdf" target="_blank">Open current ↗</a>` : ""}</div>
      </div>
      <div class="box">
        <h3>Images</h3>
        <p class="muted">Upload images here, then paste the path into a project's cover image field (or upload there directly).</p>
        <label class="btn" style="cursor:pointer;justify-self:start">Upload image…<input type="file" id="img-in" accept="image/*" hidden></label>
        <div class="grid-cards">${imgs.map((p) => `<div class="panel" style="padding:10px;display:grid;gap:6px"><img src="/site/${esc(p)}" alt="" style="border-radius:6px;aspect-ratio:16/10;object-fit:cover;width:100%"><code style="font-size:.75rem;overflow-wrap:anywhere">${esc(p)}</code></div>`).join("") || '<p class="muted">No images yet.</p>'}</div>
      </div>`;
    $("#resume-in").onchange = async (e) => {
      const f = e.target.files[0]; if (!f) return;
      try { await api("/api/resume", { method: "POST", body: f }); toast("Resume replaced"); renderFiles(); } catch (err) { toast(err.message); }
    };
    $("#img-in").onchange = async (e) => {
      const f = e.target.files[0]; if (!f) return;
      try { const r = await api("/api/image", { method: "POST", body: f, headers: { "X-Filename": encodeURIComponent(f.name) } }); toast("Uploaded " + r.path); renderFiles(); } catch (err) { toast(err.message); }
    };
  }

  /* ---------- publish ---------- */
  async function renderPublish(log, isErr) {
    const st = await api("/api/git/status").catch((e) => ({ error: e.message }));
    const logHtml = log ? `<div class="${isErr ? "err" : "log"}">${esc(log)}</div>` : "";
    if (st.error || st.git === false) {
      $("#work").innerHTML = `<h2>Publish</h2><div class="box"><div class="err">${esc(st.error || st.message)}</div></div>`; return;
    }
    if (!st.repo || !st.remote) {
      $("#work").innerHTML = `<h2>Publish</h2><p class="hint">Connect this folder to a GitHub repository once. After that, one click publishes your changes and GitHub Pages updates the live site within a minute or two.</p>
        <div class="box">
          <h3>1 · Create the repository on GitHub</h3>
          <ol class="steps">
            <li>Go to <a href="https://github.com/new" target="_blank" rel="noopener">github.com/new</a>.</li>
            <li>Name it <code>DhanushRamachandran.github.io</code> (this gives you the address <code>dhanushramachandran.github.io</code>). Make it Public. Don't add a README.</li>
            <li>Copy the HTTPS URL it shows you.</li>
          </ol>
          <h3>2 · Connect this folder</h3>
          <form id="setup" class="grid2" style="align-items:end">
            <div class="field" style="grid-column:1/-1"><label for="remote">Repository URL</label><input type="url" id="remote" required placeholder="https://github.com/DhanushRamachandran/DhanushRamachandran.github.io.git"></div>
            <div class="field"><label for="gname">Your name (for commits)</label><input type="text" id="gname" value="${esc(S.person.name)}"></div>
            <div class="field"><label for="gmail">Email (for commits)</label><input type="email" id="gmail" value="${esc(S.person.email)}"></div>
            <div><button class="btn primary" type="submit">Connect repository</button></div>
          </form>
          <h3>3 · Turn on GitHub Pages (after your first publish)</h3>
          <ol class="steps"><li>In the repository: Settings → Pages → Source: <b>Deploy from a branch</b> → <code>main</code> / <code>(root)</code> → Save.</li></ol>
          ${logHtml}
        </div>`;
      $("#setup").onsubmit = async (e) => {
        e.preventDefault();
        try { const r = await api("/api/git/setup", { method: "POST", body: JSON.stringify({ remote: $("#remote").value, name: $("#gname").value, email: $("#gmail").value }) }); renderPublish(r.log); }
        catch (err) { renderPublish(err.message, true); }
      };
      return;
    }
    $("#work").innerHTML = `<h2>Publish</h2><p class="hint">Saves your edits, commits them and pushes to GitHub. GitHub Pages rebuilds the live site automatically, usually within a minute or two.</p>
      <div class="box">
        <div class="row" style="justify-content:space-between">
          <div><span class="eyebrow">repository</span><div class="mono" style="font-size:.85rem;overflow-wrap:anywhere">${esc(st.remote)} · ${esc(st.branch)}</div></div>
          ${st.pages_url ? `<a class="btn" href="${esc(st.pages_url)}" target="_blank" rel="noopener">Open live site ↗</a>` : ""}
        </div>
        ${st.last ? `<div><span class="eyebrow">last publish</span><div class="changes">${esc(st.last)}</div></div>` : ""}
        <div><span class="eyebrow">${dirty ? "unsaved edits + " : ""}${st.changes.length} changed file${st.changes.length === 1 ? "" : "s"}</span>
          <div class="changes">${st.changes.map((c) => esc(c)).join("<br>") || (dirty ? "" : "Everything is already published.")}</div></div>
        <form id="pub" class="field">
          <label for="msg">What changed?</label>
          <input type="text" id="msg" placeholder="e.g. Add RL marketing-mix writeup">
          <div class="row" style="margin-top:8px"><button class="btn primary" type="submit" id="pub-btn">Save & publish</button>
          <button class="btn" type="button" id="pull">Sync from GitHub</button></div>
        </form>
        ${logHtml}
      </div>`;
    $("#pub").onsubmit = async (e) => {
      e.preventDefault(); const b = $("#pub-btn"); b.disabled = true; b.textContent = "Publishing…";
      try { if (dirty) await save(); const r = await api("/api/git/publish", { method: "POST", body: JSON.stringify({ message: $("#msg").value }) }); renderPublish(r.log + "\n\n✓ Pushed. The live site updates in a minute or two."); }
      catch (err) { renderPublish(err.message, true); }
    };
    $("#pull").onclick = async () => {
      if (dirty) return toast("Save first, then sync.");
      try { const r = await api("/api/git/pull", { method: "POST" }); await load(); renderPublish(r.log); } catch (err) { renderPublish(err.message, true); }
    };
  }

  /* ---------- main ---------- */
  function render() {
    paintSide();
    if (COLL[section]) return renderColl(section);
    if (section === "profile") return renderProfile();
    if (section === "skills") return renderSkills();
    if (section === "files") return renderFiles();
    if (section === "publish") return renderPublish();
  }
  async function save() {
    try { const r = await api("/api/content", { method: "POST", body: JSON.stringify(S) }); setDirty(false); toast("Saved " + r.saved); }
    catch (err) { toast(err.message); throw err; }
  }
  async function load() { S = await api("/api/content"); setDirty(false); }
  $("#save-btn").onclick = () => save().catch(() => {});
  $("#preview-btn").onclick = async () => { const w = window.open("about:blank", "_blank"); try { if (dirty) await save(); w.location = "/site/"; } catch (_) { w.close(); } };
  addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save().catch(() => {}); } });

  try { section = localStorage.getItem("admin-sec") || section; } catch (_) {}
  load().then(render).catch((err) => { $("#work").innerHTML = `<h2>Couldn't load content</h2><div class="err">${esc(err.message)}</div>`; });
})();
</script>
</body>
</html>
